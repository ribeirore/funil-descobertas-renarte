<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Renarte | Briefing de arte</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{night:'#10151C',panel:'#151C25',gold:'#F5D44A',blue:'#1A5276'},keyframes:{in:{from:{opacity:'0',transform:'translateX(16px)'},to:{opacity:'1',transform:'translateX(0)'}},back:{from:{opacity:'0',transform:'translateX(-16px)'},to:{opacity:'1',transform:'translateX(0)'}}},animation:{in:'.4s ease-out in',back:'.4s ease-out back'}}}};</script>
<style>body{background:#10151C}*{-webkit-tap-highlight-color:transparent}input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}</style>
</head>
<body class="min-h-screen px-4 py-5 font-sans text-white sm:px-6 sm:py-8">
<main class="mx-auto max-w-5xl"><header class="mb-8 flex items-center justify-between"><img src="/Logo-Renarte-SemFundo.png" alt="Renarte" class="h-12 w-auto object-contain brightness-0 invert sm:h-16"><span class="rounded-full border border-white/10 px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.18em] text-white/40">Briefing de arte</span></header>
<section class="overflow-hidden rounded-[32px] border border-white/10 bg-panel/80 shadow backdrop-blur-2xl-[0_24px_80px_rgba(0,0,0,0.28)]"><div class="h-1 bg-white/10"><div id="progress" class="h-full bg-gold transition-all duration-500" style="width:8%"></div></div><div class="px-5 py-8 sm:px-12 sm:py-12"><div id="meta" class="mb-9 hidden items-center justify-between text-xs font-bold uppercase tracking-[0.16em] text-white/35"><span>Briefing guiado</span><span id="counter">1 de 5</span></div><div id="app"></div><div id="nav" class="mt-10 hidden items-center justify-between border-t border-white/10 pt-5"><button id="back" class="inline-flex min-h-12 items-center gap-2 rounded-full px-3 text-sm font-semibold text-white/50 hover:text-white">← Voltar</button><button id="next" class="inline-flex min-h-12 items-center gap-2 rounded-full bg-gold px-6 text-sm font-semibold text-night hover:bg-white disabled:cursor-not-allowed disabled:opacity-30">Continuar →</button></div></div></section><p class="mt-5 text-center text-xs text-white/30">Renarte, pintura com intenção.</p></main>
<script>
const phoneNumber='SEUNUMERO', app=document.getElementById('app'), nav=document.getElementById('nav'), next=document.getElementById('next'), back=document.getElementById('back'), meta=document.getElementById('meta'), counter=document.getElementById('counter'), progress=document.getElementById('progress');
let step=0, dir='in'; const A={name:'',phone:'',source:'',instagram:'',email:'',size:'',desired:[],desiredCustom:[],desiredNotes:'',unwanted:[],unwantedCustom:[],unwantedNotes:'',files:[],links:[''],hasDeadline:'',deadlineDate:''};
const colors=[['Amarelo','#F5D44A'],['Azul','#2364AA'],['Verde','#4A8B68'],['Vermelho','#C94C4C'],['Laranja','#E7833D'],['Roxo','#7653A6'],['Rosa','#DB7FA3'],['Branco','#F4F3EE'],['Preto','#11161D']];
const input='min-h-14 w-full rounded-2xl border border-white/10 bg-white/[.06] px-4 text-base text-white outline-none transition placeholder:text-white/25 focus:border-gold focus:ring-4 focus:ring-gold/10';
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function field(label,html,opt=''){return `<label class="block"><span class="mb-2 block text-sm font-semibold text-white">${label} ${opt?'<span class="font-normal text-white/35">(opcional)</span>':''}</span>${html}</label>`}
function heading(ey,title,sub){return `<div class="mb-8"><p class="mb-3 text-xs font-bold uppercase tracking-[.2em] text-gold">${ey}</p><h2 class="text-3xl font-semibold leading-tight tracking-[-.03em] text-white sm:text-4xl">${title}</h2><p class="mt-3 max-w-xl text-base leading-relaxed text-white/55">${sub}</p></div>`}
function card(key,val,title,sub,icon){return `<button data-card data-key="${key}" data-value="${val}" aria-pressed="${A[key]===val}" class="relative flex min-h-[150px] w-full flex-col justify-between rounded-3xl border p-5 text-left transition ${A[key]===val?'border-gold bg-gold/10 shadow-[0_0_0_1px_rgba(245,212,74,.18)]':'border-white/10 bg-white/[.035] hover:border-gold/60 hover:bg-white/[.06]'}"><span class="mb-5 flex h-10 w-10 items-center justify-center rounded-2xl ${A[key]===val?'bg-gold text-night':'bg-white/10 text-gold'}">${icon}</span><span><span class="block pr-8 text-base font-semibold">${title}</span><span class="mt-1 block text-sm leading-relaxed text-white/50">${sub}</span></span>${A[key]===val?'<span class="absolute right-4 top-4 rounded-full bg-gold px-2 py-1 text-xs font-bold text-night">✓</span>':''}</button>`}
function colorPicker(group,title,noteKey){let custom=group==='desired'?'desiredCustom':'unwantedCustom';return `<div class="rounded-3xl border border-white/10 bg-white/[.035] p-5 sm:p-6"><div class="mb-5 flex items-center gap-3"><span class="rounded-xl bg-gold/15 p-2 text-gold">◉</span><h3 class="text-lg font-semibold">${title}</h3></div><div class="flex flex-wrap gap-3">${colors.map(c=>`<button data-color data-group="${group}" data-name="${c[0]}" title="${c[0]}" class="h-10 w-10 rounded-full border-2 transition hover:scale-110 ${A[group].includes(c[0])?'border-gold scale-110 shadow-[0_0_0_4px_rgba(245,212,74,.22)]':'border-white/25'}" style="background:${c[1]}"></button>`).join('')}<label class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-dashed border-gold/70 text-gold hover:bg-gold/10">+<input data-custom="${group}" type="color" class="sr-only"></label></div>${A[custom].length?`<div class="mt-4 flex flex-wrap gap-2">${A[custom].map(x=>`<span class="rounded-full border border-white/15 bg-white/5 px-3 py-1.5 text-xs text-white/70">Tom personalizado</span>`).join('')}</div>`:''}<div class="mt-5">${field('Observações',`<textarea data-note="${noteKey}" class="min-h-24 w-full resize-y rounded-2xl border border-white/10 bg-white/[.06] p-4 text-sm text-white outline-none placeholder:text-white/25 focus:border-gold" placeholder="Ex.: quero uma atmosfera quente e luminosa">${esc(A[noteKey])}</textarea>`,'opcional')}</div></div>`}
function render(){progress.style.width=(step===0?8:Math.max(Math.round(step/6*100),14))+'%';meta.classList.toggle('hidden',step===0||step===7);meta.classList.toggle('flex',step>0&&step<6);counter.textContent=`${step} de 5`;nav.classList.toggle('hidden',step===0||step===7);nav.classList.toggle('flex',step>0&&step<6);app.className=dir==='in'?'animate-in':'animate-back';app.innerHTML=html();bind(); updateNav()}
function html(){
if(step===0)return `<div class="mx-auto max-w-2xl py-8 text-center sm:py-12"><div class="mx-auto mb-7 flex h-20 w-20 items-center justify-center rounded-[28px] bg-gold text-night text-4xl">✧</div><p class="mb-4 text-xs font-bold uppercase tracking-[.25em] text-gold">Sua obra começa aqui</p><h1 class="text-4xl font-semibold leading-[1.08] tracking-[-.04em] sm:text-6xl">Conte sua ideia para a Renarte.</h1><p class="mx-auto mt-6 max-w-lg text-base leading-relaxed text-white/55 sm:text-lg">Um briefing rápido para transformar referências, cores e desejos em uma pintura feita para você.</p><button data-start class="mt-9 inline-flex min-h-14 items-center justify-center gap-3 rounded-full bg-gold px-8 text-base font-semibold text-night hover:bg-white">Começar →</button></div>`;
if(step===1)return `<div class="mx-auto max-w-2xl">${heading('01 / 05','Vamos começar pelo essencial.','Esses dados ajudam a Renarte a personalizar a conversa desde o primeiro contato.')}<div class="grid gap-5 sm:grid-cols-2">${field('Nome',`<input data-field="name" value="${esc(A.name)}" placeholder="Seu nome completo" class="${input}">`)}${field('Celular',`<input data-field="phone" inputmode="numeric" value="${esc(A.phone)}" placeholder="+55 21 995182554" class="${input}">`)}${field('Como conheceu?',`<select data-field="source" class="${input} appearance-none"><option value="">Selecione uma opção</option>${['Indicação','Redes Sociais','Site','Outro'].map(x=>`<option ${A.source===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('Instagram',`<input data-field="instagram" value="${esc(A.instagram)}" placeholder="@seuusuario" class="${input}">`,'opcional')}${field('E-mail',`<input data-field="email" type="email" value="${esc(A.email)}" placeholder="voce@email.com" class="${input}">`,'opcional')}</div></div>`;
if(step===2)return `<div>${heading('02 / 05','Qual tamanho combina com seu espaço?','As medidas são referências iniciais. A proporção final será definida em conjunto.')}<div class="grid gap-4 sm:grid-cols-2">${card('size','Pequeno','Pequeno','Até 30 X 40 cm. Um detalhe especial.','▧')}${card('size','Médio','Médio','De 80 X 100 cm até 120 X 160 cm.','▧')}${card('size','Grande','Grande','Acima de 120 X 160 cm. Uma peça protagonista.','▧')}${card('size','Ainda não sei','Ainda não sei','Podemos definir juntos a proporção ideal.','◌')}</div></div>`;
if(step===3)return `<div>${heading('03 / 05','Que cores você quer sentir na pintura?','Selecione quantas cores quiser e conte mais nas observações.')}<div class="space-y-5">${colorPicker('desired','Cores desejadas','desiredNotes')}${colorPicker('unwanted','Cores indesejadas','unwantedNotes')}</div></div>`;
if(step===4)return `<div>${heading('04 / 05','Vamos reunir referências visuais.','Envie imagens do seu celular ou adicione links do Pinterest, Instagram e outros sites.')}<div class="space-y-6"><label class="flex min-h-36 cursor-pointer flex-col items-center justify-center rounded-3xl border border-dashed border-gold/60 bg-gold/[.04] text-center hover:bg-gold/[.08]"><input id="files" type="file" accept="image/*" capture="environment" multiple class="sr-only"><span class="mb-3 text-3xl text-gold">⌾</span><span class="text-sm font-semibold">Abrir câmera ou escolher fotos</span><span class="mt-1 text-xs text-white/40">JPG, PNG ou imagens do rolo de câmera</span></label>${A.files.length?`<div class="flex flex-wrap gap-2">${A.files.map(x=>`<span class="rounded-full bg-white/10 px-3 py-2 text-xs text-white/70">${esc(x)}</span>`).join('')}</div>`:''}<div class="space-y-3">${A.links.map((x,i)=>`<div class="flex gap-2"><input data-link="${i}" value="${esc(x)}" type="url" placeholder="https://..." class="${input}">${A.links.length>1?`<button data-remove="${i}" class="rounded-2xl border border-white/10 px-4 text-white/45 hover:border-red-400 hover:text-red-300">×</button>`:''}</div>`).join('')}<button data-add-link class="inline-flex min-h-11 items-center gap-2 rounded-full border border-gold/50 px-4 text-sm font-semibold text-gold hover:bg-gold/10">+ Adicionar outro link</button></div></div></div>`;
if(step===5)return `<div class="mx-auto max-w-2xl">${heading('05 / 05','Você possui um prazo específico?','Se houver uma data importante, vamos considerar isso desde o planejamento da obra.')}<div class="grid gap-4 sm:grid-cols-2">${card('hasDeadline','Sim','Sim, tenho uma data','Quero marcar o dia em que preciso receber.','✓')}${card('hasDeadline','Não','Não tenho prazo','Prefiro viver o processo com calma.','✧')}</div>${A.hasDeadline==='Sim'?`<div class="mt-6 rounded-3xl border border-gold/40 bg-gold/[.05] p-5">${field('Escolha a data desejada',`<input data-field="deadlineDate" type="date" value="${A.deadlineDate}" class="${input}">`)}</div>`:''}</div>`;
if(step===7)return `<div class="mx-auto max-w-2xl py-10 text-center sm:py-16"><div class="mx-auto mb-7 flex h-20 w-20 items-center justify-center rounded-full bg-gold text-night text-4xl">✓</div><p class="mb-4 text-xs font-bold uppercase tracking-[.25em] text-gold">Briefing enviado</p><h2 class="text-3xl font-semibold tracking-[-.03em] sm:text-5xl">Obrigada por confiar na Renarte.</h2><p class="mx-auto mt-5 max-w-lg text-base leading-relaxed text-white/60 sm:text-lg">Recebemos suas informações e vamos analisar cada detalhe com carinho.</p><div class="mx-auto mt-8 max-w-md rounded-3xl border border-gold/30 bg-gold/[.08] p-5 text-sm leading-relaxed text-white/80 backdrop-blur-xl">O prazo para retorno com a proposta é de <strong class="text-gold">2 dias</strong>.</div><button data-restart class="mt-8 inline-flex min-h-12 items-center gap-2 rounded-full border border-white/20 px-5 text-sm font-semibold text-white/70 hover:border-gold hover:text-gold">Voltar ao início</button></div>`;
const rows=[['Nome',A.name],['Celular',A.phone],['Como conheceu',A.source],['Instagram',A.instagram],['E-mail',A.email],['Tamanho',A.size],['Cores desejadas',A.desired.concat(A.desiredCustom).join(', ')],['Observações desejadas',A.desiredNotes],['Cores indesejadas',A.unwanted.concat(A.unwantedCustom).join(', ')],['Observações indesejadas',A.unwantedNotes],['Links',A.links.filter(Boolean).join(', ')],['Imagens',A.files.join(', ')],['Prazo específico',A.hasDeadline],['Data desejada',A.deadlineDate]];return `<div><div class="mb-8 text-center"><div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-gold text-night text-2xl">✓</div><p class="mb-3 text-xs font-bold uppercase tracking-[.25em] text-gold">Revisão final</p><h2 class="text-3xl font-semibold tracking-[-.03em] sm:text-4xl">Resumo do Briefing</h2><p class="mx-auto mt-4 max-w-lg text-white/55">Revise suas informações antes de enviar para a Renarte.</p></div><div class="divide-y divide-white/10 overflow-hidden rounded-3xl border border-white/10 bg-white/[.035]">${rows.filter(([,v])=>v).map(([l,v])=>`<div class="grid gap-1 px-5 py-4 sm:grid-cols-[190px_1fr] sm:gap-5"><span class="text-xs font-bold uppercase tracking-[.12em] text-gold">${l}</span><span class="break-words text-sm leading-relaxed text-white/80">${esc(v)}</span></div>`).join('')}</div><div class="mt-7 grid gap-3 sm:grid-cols-2"><button data-copy class="inline-flex min-h-14 items-center justify-center gap-3 rounded-full border border-white/25 px-5 text-sm font-semibold hover:border-gold hover:text-gold">▣ Copiar resumo</button><button data-whatsapp class="inline-flex min-h-14 items-center justify-center gap-3 rounded-full bg-gold px-5 text-sm font-semibold text-night hover:bg-white">➤ Enviar pelo WhatsApp</button></div><p id="feedback" class="mt-4 text-center text-sm text-gold"></p></div>`;
}
function can(){return step===1?Boolean(A.name.trim()&&A.phone.trim()&&A.source):step===2?Boolean(A.size):step===5?Boolean(A.hasDeadline&&(A.hasDeadline==='Não'||A.deadlineDate)):true}
function updateNav(){if(step>0&&step<6){next.disabled=!can();next.textContent=step===5?'Ver resumo →':'Continuar →'}}
function move(s){dir=s>step?'in':'back';step=Math.max(0,Math.min(s,7));render()}
function summary(){let v=x=>x.trim()||'Não informado';return ['Olá! Gostaria de conversar sobre uma encomenda de pintura Renarte.','','RESUMO DO BRIEFING',`Nome: ${v(A.name)}`,`Celular: ${v(A.phone)}`,`Como conheceu: ${v(A.source)}`,`Instagram: ${v(A.instagram)}`,`E-mail: ${v(A.email)}`,`Tamanho: ${v(A.size)}`,`Cores desejadas: ${v(A.desired.concat(A.desiredCustom).join(', '))}`,`Observações sobre cores desejadas: ${v(A.desiredNotes)}`,`Cores indesejadas: ${v(A.unwanted.concat(A.unwantedCustom).join(', '))}`,`Observações sobre cores indesejadas: ${v(A.unwantedNotes)}`,`Links de referência: ${A.links.filter(Boolean).join(', ')||'Não informado'}`,`Imagens anexadas: ${A.files.join(', ')||'Nenhuma'}`,`Possui prazo específico: ${v(A.hasDeadline)}`,...(A.hasDeadline==='Sim'?[`Data desejada: ${v(A.deadlineDate)}`]:[])].join('\n')}
function bind(){document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{A[b.dataset.key]=b.dataset.value;if(b.dataset.key==='hasDeadline'&&b.dataset.value==='Não')A.deadlineDate='';render()});document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>{A[i.dataset.field]=i.value;if(i.dataset.field==='phone'){let d=i.value.replace(/\D/g,'').slice(0,11);A.phone=d.length<=2?d:d.length<=7?`(${d.slice(0,2)}) ${d.slice(2)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;i.value=A.phone}updateNav()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{let g=b.dataset.group,k=g==='desired'?'desired':'unwanted';A[k]=A[k].includes(b.dataset.name)?A[k].filter(x=>x!==b.dataset.name):A[k].concat(b.dataset.name);render()});document.querySelectorAll('[data-custom]').forEach(i=>i.onchange=()=>{let k=i.dataset.custom==='desired'?'desiredCustom':'unwantedCustom';if(i.value)A[k]=A[k].concat(i.value);render()});document.querySelectorAll('[data-note]').forEach(i=>i.oninput=()=>A[i.dataset.note]=i.value);document.querySelectorAll('[data-link]').forEach(i=>i.oninput=()=>A.links[i.dataset.link]=i.value);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{A.links.splice(+b.dataset.remove,1);render()});let files=document.getElementById('files');if(files)files.onchange=()=>{A.files=A.files.concat(Array.from(files.files).map(x=>x.name));render()};let add=document.querySelector('[data-add-link]');if(add)add.onclick=()=>{A.links.push('');render()};let start=document.querySelector('[data-start]');if(start)start.onclick=()=>move(1);let copy=document.querySelector('[data-copy]');if(copy)copy.onclick=()=>{if(!navigator.clipboard){document.getElementById('feedback').textContent='Copie o texto manualmente ou permita acesso à área de transferência.';return}navigator.clipboard.writeText(summary()).then(()=>document.getElementById('feedback').textContent='Resumo copiado.').catch(()=>document.getElementById('feedback').textContent='Não foi possível copiar automaticamente.')};let wa=document.querySelector('[data-whatsapp]');if(wa)wa.onclick=()=>{window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(summary())}`,'_blank','noopener,noreferrer');move(7)};let restart=document.querySelector('[data-restart]');if(restart)restart.onclick=()=>move(0)}
back.onclick=()=>move(step-1);next.onclick=()=>can()&&move(step+1);render();
</script></body></html>
