<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Renarte | Briefing de arte</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{night:'#10151C',panel:'#151C25',gold:'#F5D44A'}}}};</script>
<style>body{background:#10151C}*{-webkit-tap-highlight-color:transparent}.watermark{opacity:.055;filter:brightness(0) invert(1)}input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}</style>
</head>
<body class="min-h-screen px-4 py-5 font-sans text-white sm:px-6 sm:py-8">
<main class="mx-auto max-w-5xl"><header class="mb-8 flex items-center justify-between"><img src="/Logo-Renarte-SemFundo.png" alt="Renarte" class="h-12 w-auto object-contain brightness-0 invert sm:h-16"><span class="rounded-full border border-white/10 px-3 py-1.5 text-[10px] font-bold uppercase tracking-[.18em] text-white/40">Briefing de arte</span></header>
<section class="relative overflow-hidden rounded-[32px] border border-white/10 bg-[#151C25]/80 shadow-[0_24px_80px_rgba(0,0,0,.28)] backdrop-blur-2xl"><div class="h-1 bg-white/10"><div id="progress" class="h-full bg-[#F5D44A] transition-all duration-500" style="width:8%"></div></div><div class="relative z-10 px-5 py-8 sm:px-12 sm:py-12"><div id="meta" class="mb-7 hidden items-center justify-between text-xs font-bold uppercase tracking-[.16em] text-white/35"><span>Briefing guiado</span><span id="counter"></span></div><nav id="stepNav" class="mb-8 hidden flex-wrap gap-2" aria-label="Navegação das etapas"></nav><div id="app"></div><div id="nav" class="mt-10 hidden items-center justify-between border-t border-white/10 pt-5"><button id="back" type="button" class="inline-flex min-h-12 items-center gap-2 rounded-full px-3 text-sm font-semibold text-white/50 hover:text-white">← Voltar</button><button id="next" type="button" class="inline-flex min-h-12 items-center gap-2 rounded-full bg-[#F5D44A] px-6 text-sm font-semibold text-[#10151C] hover:bg-white disabled:cursor-not-allowed disabled:opacity-30">Continuar →</button></div></div></section><p class="mt-5 text-center text-xs text-white/30">Renarte, pintura com intenção.</p></main>
<script>
const app=document.getElementById('app'),nav=document.getElementById('nav'),next=document.getElementById('next'),back=document.getElementById('back'),meta=document.getElementById('meta'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),stepNav=document.getElementById('stepNav');
const stages=[['1','Contato'],['2','Tamanho'],['3','Cores'],['4','Referências'],['5','Prazo'],['6','Resumo']];let step=0,sending=false,dir='in';
const A={name:'',phone:'',source:'',instagram:'',email:'',size:'',desired:[],desiredCustom:[],desiredNotes:'',unwanted:[],unwantedCustom:[],unwantedNotes:'',files:[],links:[''],hasDeadline:'',deadlineDate:''};
const colors=[['Amarelo','#F5D44A'],['Azul','#2364AA'],['Verde','#4A8B68'],['Vermelho','#C94C4C'],['Laranja','#E7833D'],['Roxo','#7653A6'],['Rosa','#DB7FA3'],['Branco','#F4F3EE'],['Preto','#11161D']];const input='min-h-14 w-full rounded-2xl border border-white/10 bg-white/[.06] px-4 text-base text-white outline-none placeholder:text-white/25 focus:border-[#F5D44A] focus:ring-4 focus:ring-[#F5D44A]/10';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const v=x=>String(x??'').trim()||'Não informado';
function field(l,h,o=''){return `<label class="block"><span class="mb-2 block text-sm font-semibold">${l} ${o?'<span class="font-normal text-white/35">(opcional)</span>':''}</span>${h}</label>`}function head(e,t,s){return `<div class="mb-8"><p class="mb-3 text-xs font-bold uppercase tracking-[.2em] text-[#F5D44A]">${e}</p><h2 class="text-3xl font-semibold leading-tight sm:text-4xl">${t}</h2><p class="mt-3 max-w-xl text-base leading-relaxed text-white/55">${s}</p></div>`}function card(k,val,t,s,i){let on=A[k]===val;return `<button type="button" data-card data-key="${k}" data-value="${val}" aria-pressed="${on}" class="relative flex min-h-[150px] w-full flex-col justify-between rounded-3xl border p-5 text-left transition ${on?'border-[#F5D44A] bg-[#F5D44A]/10':'border-white/10 bg-white/[.035] hover:border-[#F5D44A]/60'}"><span class="mb-5 flex h-10 w-10 items-center justify-center rounded-2xl ${on?'bg-[#F5D44A] text-[#10151C]':'bg-white/10 text-[#F5D44A]'}">${i}</span><span><span class="block text-base font-semibold">${t}</span><span class="mt-1 block text-sm text-white/50">${s}</span></span>${on?'<b class="absolute right-4 top-4 rounded-full bg-[#F5D44A] px-2 py-1 text-xs text-[#10151C]">✓</b>':''}</button>`}
function picker(g,t,n){let c=g==='desired'?'desiredCustom':'unwantedCustom';return `<div class="rounded-3xl border border-white/10 bg-white/[.035] p-5"><h3 class="mb-5 text-lg font-semibold">${t}</h3><div class="flex flex-wrap gap-3">${colors.map(x=>`<button type="button" data-color data-group="${g}" data-name="${x[0]}" aria-label="${x[0]}" class="h-10 w-10 rounded-full border-2 ${A[g].includes(x[0])?'scale-110 border-[#F5D44A] shadow-[0_0_0_4px_rgba(245,212,74,.22)]':'border-white/25'}" style="background:${x[1]}"></button>`).join('')}<label class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-dashed border-[#F5D44A] text-[#F5D44A]">+<input data-custom="${g}" type="color" class="sr-only"></label></div>${A[c].length?`<div class="mt-4 flex flex-wrap gap-2">${A[c].map(x=>`<span class="rounded-full bg-white/5 px-3 py-1.5 text-xs">Tom personalizado</span>`).join('')}</div>`:''}<div class="mt-5">${field('Observações',`<textarea data-note="${n}" class="min-h-24 w-full rounded-2xl border border-white/10 bg-white/[.06] p-4 text-sm text-white outline-none focus:border-[#F5D44A]">${esc(A[n])}</textarea>`,'opcional')}</div></div>`}
function html(){if(step===0)return `<div class="mx-auto max-w-2xl py-8 text-center sm:py-12"><div class="mx-auto mb-7 flex h-20 w-20 items-center justify-center rounded-[28px] bg-[#F5D44A] text-[#10151C] text-4xl">✧</div><p class="mb-4 text-xs font-bold uppercase tracking-[.25em] text-[#F5D44A]">Sua obra começa aqui</p><h1 class="text-4xl font-semibold sm:text-6xl">Conte sua ideia para a Renarte.</h1><p class="mx-auto mt-6 max-w-lg text-base leading-relaxed text-white/55">Um briefing rápido para transformar referências, cores e desejos em uma pintura feita para você.</p><button type="button" data-start class="mt-9 inline-flex min-h-14 rounded-full bg-[#F5D44A] px-8 text-base font-semibold text-[#10151C]">Começar →</button></div>`;
if(step===1)return `<div class="mx-auto max-w-2xl">${head('01 / 05','Vamos começar pelo essencial.','Esses dados ajudam a Renarte a personalizar a conversa desde o primeiro contato.')}<div class="grid gap-5 sm:grid-cols-2">${field('Nome',`<input data-field="name" value="${esc(A.name)}" placeholder="Seu nome completo" class="${input}">`)}${field('Celular',`<input data-field="phone" inputmode="numeric" value="${esc(A.phone)}" placeholder="+55 21 995182554" class="${input}">`)}${field('Como conheceu?',`<select data-field="source" class="${input} appearance-none"><option value="">Selecione uma opção</option>${['Indicação','Redes Sociais','Site','Outro'].map(x=>`<option ${A.source===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('Instagram',`<input data-field="instagram" value="${esc(A.instagram)}" placeholder="@seuusuario" class="${input}">`,'opcional')}${field('E-mail',`<input data-field="email" type="email" value="${esc(A.email)}" placeholder="voce@email.com" class="${input}">`,'opcional')}</div></div>`;
if(step===2)return `<div>${head('02 / 05','Qual tamanho combina com seu espaço?','As medidas são referências iniciais. A proporção final será definida em conjunto.')}<div class="grid gap-4 sm:grid-cols-2">${card('size','Pequeno','Pequeno','Até 30 X 40 cm.','▧')}${card('size','Médio','Médio','De 80 X 100 cm até 120 X 160 cm.','▧')}${card('size','Grande','Grande','Acima de 120 X 160 cm.','▧')}${card('size','Ainda não sei','Ainda não sei','Podemos definir juntos.','◌')}</div></div>`;
if(step===3)return `<div>${head('03 / 05','Que cores você quer sentir na pintura?','Selecione quantas cores quiser e conte mais nas observações.')}<div class="space-y-5">${picker('desired','Cores desejadas','desiredNotes')}${picker('unwanted','Cores indesejadas','unwantedNotes')}</div></div>`;
if(step===4)return `<div>${head('04 / 05','Vamos reunir referências visuais.','Envie imagens do celular ou adicione links.')}<div class="space-y-6"><label class="flex min-h-36 cursor-pointer flex-col items-center justify-center rounded-3xl border border-dashed border-[#F5D44A]/60 bg-[#F5D44A]/[.04] text-center"><input id="files" type="file" accept="image/*" capture="environment" multiple class="sr-only"><span class="mb-3 text-3xl text-[#F5D44A]">⌾</span><span class="text-sm font-semibold">Abrir câmera ou escolher fotos</span><span class="mt-1 text-xs text-white/40">Os arquivos serão enviados como anexos.</span></label>${A.files.length?`<div class="grid grid-cols-2 gap-3 sm:grid-cols-4">${A.files.map((x,i)=>`<div class="overflow-hidden rounded-2xl border border-white/10"><img src="${x.preview}" alt="${esc(x.file.name)}" class="h-28 w-full object-cover"><button type="button" data-remove-file="${i}" class="w-full py-2 text-xs text-white/70">Remover</button><p class="truncate px-2 pb-2 text-xs text-white/50">${esc(x.file.name)}</p></div>`).join('')}</div>`:''}<div class="space-y-3">${A.links.map((x,i)=>`<div class="flex gap-2"><input data-link="${i}" value="${esc(x)}" type="url" placeholder="https://..." class="${input}">${A.links.length>1?`<button type="button" data-remove-link="${i}" class="rounded-2xl border border-white/10 px-4">×</button>`:''}</div>`).join('')}<button type="button" data-add-link class="min-h-11 rounded-full border border-[#F5D44A]/50 px-4 text-sm font-semibold text-[#F5D44A]">+ Adicionar outro link</button></div></div></div>`;
if(step===5)return `<div class="mx-auto max-w-2xl">${head('05 / 05','Você possui um prazo específico?','Se houver uma data importante, vamos considerar isso desde o planejamento.')}<div class="grid gap-4 sm:grid-cols-2">${card('hasDeadline','Sim','Sim, tenho uma data','Quero marcar o dia.','✓')}${card('hasDeadline','Não','Não tenho prazo','Prefiro viver o processo com calma.','✧')}</div>${A.hasDeadline==='Sim'?`<div class="mt-6 rounded-3xl border border-[#F5D44A]/40 p-5">${field('Escolha a data desejada',`<input data-field="deadlineDate" type="date" value="${A.deadlineDate}" class="${input}">`)}</div>`:''}</div>`;
if(step===7)return `<div class="relative isolate mx-auto max-w-2xl overflow-hidden py-10 text-center sm:py-16"><img src="/Logo-Renarte-SemFundo.png" alt="" aria-hidden="true" class="watermark pointer-events-none absolute left-1/2 top-1/2 z-[-1] w-[120%] max-w-none -translate-x-1/2 -translate-y-1/2"><div class="relative"><div class="mx-auto mb-7 flex h-20 w-20 items-center justify-center rounded-full bg-[#F5D44A] text-[#10151C] text-4xl">✓</div><p class="mb-4 text-xs font-bold uppercase tracking-[.25em] text-[#F5D44A]">Briefing enviado</p><h2 class="text-3xl font-semibold sm:text-5xl">Obrigada por confiar na Renarte.</h2><p class="mx-auto mt-5 max-w-lg text-white/60">Recebemos suas informações e vamos analisar cada detalhe com carinho.</p><div class="mx-auto mt-8 max-w-md rounded-3xl border border-[#F5D44A]/30 bg-[#F5D44A]/[.08] p-5 text-sm text-white/80">O prazo para retorno com a proposta é de <strong class="text-[#F5D44A]">2 dias</strong>.</div><button type="button" data-restart class="mt-8 min-h-12 rounded-full border border-white/20 px-5 text-sm">Voltar ao início</button></div></div>`;
const rows=[['Nome',A.name],['Celular',A.phone],['Como conheceu',A.source],['Instagram',A.instagram],['E-mail',A.email],['Tamanho',A.size],['Cores desejadas',A.desired.concat(A.desiredCustom).join(', ')],['Observações desejadas',A.desiredNotes],['Cores indesejadas',A.unwanted.concat(A.unwantedCustom).join(', ')],['Observações indesejadas',A.unwantedNotes],['Links',A.links.filter(Boolean).join(', ')],['Imagens',A.files.map(x=>x.file.name).join(', ')],['Prazo específico',A.hasDeadline],['Data desejada',A.deadlineDate]];return `<div><div class="mb-8 text-center"><div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-[#F5D44A] text-[#10151C] text-2xl">✓</div><p class="mb-3 text-xs font-bold uppercase tracking-[.25em] text-[#F5D44A]">Revisão final</p><h2 class="text-3xl font-semibold sm:text-4xl">Resumo do Briefing</h2><p class="mx-auto mt-4 max-w-lg text-white/55">Revise suas informações antes de enviar.</p></div><div class="divide-y divide-white/10 overflow-hidden rounded-3xl border border-white/10 bg-white/[.035]">${rows.filter(([,x])=>x).map(([l,x])=>`<div class="grid gap-1 px-5 py-4 sm:grid-cols-[190px_1fr] sm:gap-5"><span class="text-xs font-bold uppercase tracking-[.12em] text-[#F5D44A]">${l}</span><span class="break-words text-sm text-white/80">${esc(x)}</span></div>`).join('')}</div><div class="mt-7"><button type="button" data-email class="inline-flex min-h-14 w-full items-center justify-center rounded-full bg-[#F5D44A] px-5 text-sm font-semibold text-[#10151C]">✉ Enviar briefing por e-mail</button><p id="feedback" class="mt-4 text-center text-sm text-[#F5D44A]" aria-live="polite"></p></div></div>`}
function render(){const active=step>0&&step<7;progress.style.width=(step===0?8:step===7?100:Math.round(step/6*100))+'%';meta.classList.toggle('hidden',!active);meta.classList.toggle('flex',active);counter.textContent=active?`${step} de 6`:'';nav.classList.toggle('hidden',step===0||step===6||step===7);nav.classList.toggle('flex',step>0&&step<6);stepNav.classList.toggle('hidden',!active);stepNav.classList.toggle('flex',active);stepNav.innerHTML=stages.map(s=>`<button type="button" data-goto="${s[0]}" aria-current="${step==s[0]?'step':'false'}" class="rounded-full border px-3 py-2 text-xs font-semibold ${step==s[0]?'border-[#F5D44A] bg-[#F5D44A]/15 text-[#F5D44A]':'border-white/10 text-white/45 hover:border-[#F5D44A]/50'}">${s[0]}. ${s[1]}</button>`).join('');app.innerHTML=html();bind();updateNav()}
function valid(){return step===1?Boolean(A.name.trim()&&A.phone.trim()&&A.source):step===2?Boolean(A.size):step===5?Boolean(A.hasDeadline&&(A.hasDeadline==='Não'||A.deadlineDate)):true}function updateNav(){if(step>0&&step<6){next.disabled=!valid();next.textContent=step===5?'Ver resumo →':'Continuar →'}}function move(n){dir=n>step?'in':'back';step=Math.max(0,Math.min(n,7));render()}
function textSummary(){return ['Olá! Gostaria de conversar sobre uma encomenda de pintura Renarte.','','RESUMO DO BRIEFING',`Nome: ${v(A.name)}`,`Celular: ${v(A.phone)}`,`Como conheceu: ${v(A.source)}`,`Instagram: ${v(A.instagram)}`,`E-mail: ${v(A.email)}`,`Tamanho: ${v(A.size)}`,`Cores desejadas: ${v(A.desired.concat(A.desiredCustom).join(', '))}`,`Observações sobre cores desejadas: ${v(A.desiredNotes)}`,`Cores indesejadas: ${v(A.unwanted.concat(A.unwantedCustom).join(', '))}`,`Observações sobre cores indesejadas: ${v(A.unwantedNotes)}`,`Links: ${A.links.filter(Boolean).join(', ')||'Não informado'}`,`Imagens: ${A.files.map(x=>x.file.name).join(', ')||'Nenhuma'}`,`Prazo: ${v(A.hasDeadline)}`,...(A.hasDeadline==='Sim'?[`Data: ${v(A.deadlineDate)}`]:[])].join('\n')}
async function attachment(x){const b=await x.file.arrayBuffer();let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return {filename:x.file.name,content:btoa(s),contentType:x.file.type}}
async function send(){const f=document.getElementById('feedback'),b=document.querySelector('[data-email]');if(sending)return;sending=true;b.disabled=true;b.textContent='Enviando briefing...';f.textContent='Preparando o e-mail e os anexos.';try{const at=await Promise.all(A.files.map(attachment));const r=await fetch('/api/send-briefing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:{...A,files:A.files.map(x=>x.file.name)},summary:textSummary(),attachments:at})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível enviar o briefing.');move(7)}catch(e){f.textContent=e.message||'Não foi possível enviar o briefing. Tente novamente.';b.disabled=false;b.textContent='✉ Enviar briefing por e-mail';sending=false}}
function bind(){document.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>move(Number(x.dataset.goto)));document.querySelectorAll('[data-card]').forEach(x=>x.onclick=()=>{A[x.dataset.key]=x.dataset.value;if(x.dataset.key==='hasDeadline'&&x.dataset.value==='Não')A.deadlineDate='';render()});document.querySelectorAll('[data-field]').forEach(x=>x.oninput=()=>{A[x.dataset.field]=x.value;if(x.dataset.field==='phone'){const d=x.value.replace(/\D/g,'').slice(0,11);A.phone=d.length<=2?d:d.length<=7?`(${d.slice(0,2)}) ${d.slice(2)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;x.value=A.phone}updateNav()});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{const g=x.dataset.group;A[g]=A[g].includes(x.dataset.name)?A[g].filter(y=>y!==x.dataset.name):A[g].concat(x.dataset.name);render()});document.querySelectorAll('[data-custom]').forEach(x=>x.onchange=()=>{const k=x.dataset.custom==='desired'?'desiredCustom':'unwantedCustom';if(x.value)A[k]=A[k].concat(x.value);render()});document.querySelectorAll('[data-note]').forEach(x=>x.oninput=()=>A[x.dataset.note]=x.value);document.querySelectorAll('[data-link]').forEach(x=>x.oninput=()=>A.links[x.dataset.link]=x.value);document.querySelectorAll('[data-remove-link]').forEach(x=>x.onclick=()=>{A.links.splice(Number(x.dataset.removeLink),1);render()});document.querySelectorAll('[data-remove-file]').forEach(x=>x.onclick=()=>{const z=A.files.splice(Number(x.dataset.removeFile),1)[0];if(z)URL.revokeObjectURL(z.preview);render()});const fi=document.getElementById('files');if(fi)fi.onchange=()=>{A.files=A.files.concat(Array.from(fi.files).map(file=>({file,preview:URL.createObjectURL(file)})));render()};const al=document.querySelector('[data-add-link]');if(al)al.onclick=()=>{A.links.push('');render()};const st=document.querySelector('[data-start]');if(st)st.onclick=()=>move(1);const em=document.querySelector('[data-email]');if(em)em.onclick=send;const re=document.querySelector('[data-restart]');if(re)re.onclick=()=>move(0)}
back.onclick=()=>move(step-1);next.onclick=()=>valid()&&move(step+1);render();
</script></body></html>
